name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q src app tests

      - name: Audit narasi (Kenapa·Tujuan·Dampak & Insight)
        run: |
          python src/explanations.py
          python -c "import sys; sys.path.insert(0,'src'); import insights_content; import insight; sys.exit(0 if insight.audit() else 1)"

      # GADM boundaries (publik, TANPA kredensial) → staging + geometri.
      - name: Ingest GADM boundaries
        run: python src/ingest_geo.py

      # BPS opsional: dijalankan HANYA bila secret BPS_API_KEY diset.
      - name: Ingest BPS indicators (opsional)
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: |
          if [ -n "$BPS_API_KEY" ]; then
            python src/ingest_bps.py
          else
            echo "BPS_API_KEY tidak diset — melewati ingest BPS (pakai data marts)."
          fi

      # Muat staging yang ada + rebuild tabel marts dari Parquet (agar lengkap).
      - name: Load staging + rebuild marts
        run: |
          python src/load_db.py
          python scripts/rebuild_from_marts.py

      - name: Data quality tests
        run: python tests/test_data_quality.py
